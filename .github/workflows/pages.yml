name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build asset manifest
        run: |
          cd assets
          files=$(find portraits cutin sprites -name '*.png' 2>/dev/null | sort | sed 's/.*/"&"/' | paste -sd, -)
          echo "window.ASSET_FILES = [${files}];" > manifest.js
          cat manifest.js
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html js assets .nojekyll _site/
          # cache-bust scripts so players always get the latest build
          sed -i -E "s#src=\"(js|assets)/([^\"]+)\.js\"#src=\"\1/\2.js?v=${GITHUB_SHA::7}\"#g" _site/index.html
          grep -n '<script' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
